name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux, Python 3.12)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # migration fixtures read the released v0.5.x tags
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: |
          python -m pip install "PyYAML==6.0.3" "jsonschema==4.26.0"
          apm_version="$(python -c "import json; print(json.load(open('scripts/release-tools.json'))['apm'])")"
          python -m pip install "apm-cli==${apm_version}"
      - name: Run all checks
        run: bash scripts/check-all.sh

  windows:
    name: Tests (Windows, Python 3.12)
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        shell: bash
        run: |
          python -m pip install "PyYAML==6.0.3" "jsonschema==4.26.0"
          apm_version="$(python -c "import json; print(json.load(open('scripts/release-tools.json'))['apm'])")"
          python -m pip install "apm-cli==${apm_version}"
      - name: Run test suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/run-suites.py contracts skills init migrate packaging release

  python39:
    name: Shipped scripts on Python 3.9 (standard library only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Run suites for the shipped scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/run-suites.py contracts init migrate
