name: Release

# A v<semver> tag builds the release assets from the tagged commit and publishes them.
# Build and publish are separate jobs: only the publish job can write to the repository.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must point at a commit on main
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: |
          python -m pip install "PyYAML==6.0.3" "jsonschema==4.26.0"
          apm_version="$(python -c "import json; print(json.load(open('scripts/release-tools.json'))['apm'])")"
          python -m pip install "apm-cli==${apm_version}"
      - name: Extract the changelog section for this tag
        run: python scripts/changelog.py --tag "${TAG}" --output notes.md
      - name: Run all checks
        run: bash scripts/check-all.sh
      - name: Build the release assets
        run: python scripts/build-release.py --output dist --tag "${TAG}" --revision "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          overwrite: true
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release
      - name: Publish (resumes a draft, never changes a published release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/publish-release.py
          --tag "${TAG}"
          --revision "${GITHUB_SHA}"
          --assets-dir release/dist
          --notes release/notes.md
          --repo "${GITHUB_REPOSITORY}"
